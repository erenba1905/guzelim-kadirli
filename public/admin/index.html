<!DOCTYPE html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Güzelim Kadirli Admin
  </title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7f5;

      color: #1f2933;

      line-height: 1.5;
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .login {
      max-width: 450px;

      margin: 80px auto;

      padding: 28px;

      background: white;

      border:
        1px solid #e0e6e1;

      border-radius: 18px;
    }


    .login h2 {
      margin-bottom: 8px;
    }


    .login p {
      margin-bottom: 20px;

      color: #68736d;
    }


    .login input {
      width: 100%;

      min-height: 46px;

      padding: 10px 12px;

      margin-bottom: 12px;

      border:
        1px solid #d8dfda;

      border-radius: 9px;
    }


    .login button {
      width: 100%;

      min-height: 46px;

      border: 0;

      border-radius: 9px;

      background: #1f7a4d;

      color: white;

      font-weight: bold;
    }


    .login-error {
      margin-top: 10px;

      color: #a22;

      font-size: 14px;
    }


    header {
      background: #173122;

      color: white;

      padding: 18px 24px;
    }


    .header-inner {
      max-width: 1150px;

      margin: auto;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    header a {
      color: white;

      text-decoration: none;
    }


    main {
      max-width: 1150px;

      margin: 35px auto;

      padding:
        0
        20px
        60px;
    }


    .tabs {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 22px;
    }


    .tab {
      padding: 10px 17px;

      border:
        1px solid #d7ded8;

      border-radius: 9px;

      background: white;

      font-weight: bold;
    }


    .tab.active {
      background: #1f7a4d;

      color: white;

      border-color: #1f7a4d;
    }


    .panel {
      display: none;
    }


    .panel.active {
      display: block;
    }


    .box {
      padding: 24px;

      margin-bottom: 22px;

      background: white;

      border:
        1px solid #e1e6e2;

      border-radius: 16px;
    }


    .box-head {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

      flex-wrap: wrap;

      margin-bottom: 20px;
    }


    .box-head p {
      color: #68736d;
    }


    .primary {
      padding: 10px 15px;

      border: 0;

      border-radius: 9px;

      background: #1f7a4d;

      color: white;

      font-weight: bold;
    }


    .secondary {
      padding: 10px 15px;

      border:
        1px solid #d8dfda;

      border-radius: 9px;

      background: white;

      font-weight: bold;
    }


    .danger {
      padding: 9px 13px;

      border: 0;

      border-radius: 8px;

      background: #b84444;

      color: white;

      font-weight: bold;
    }


    .warning {
      padding: 9px 13px;

      border: 0;

      border-radius: 8px;

      background: #d59b31;

      color: white;

      font-weight: bold;
    }


    .edit {
      padding: 9px 13px;

      border: 0;

      border-radius: 8px;

      background: #e5eee8;

      color: #1f7a4d;

      font-weight: bold;
    }


    .list {
      display: grid;

      gap: 15px;
    }


    .item {
      padding: 19px;

      border:
        1px solid #e1e6e2;

      border-radius: 13px;

      background: #fafcfb;
    }


    .item-top {
      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;

      flex-wrap: wrap;

      margin-bottom: 13px;
    }


    .item-name {
      font-size: 20px;

      font-weight: bold;
    }


    .status {
      padding: 5px 9px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: bold;
    }


    .pending {
      background: #fff1c9;

      color: #755600;
    }


    .approved {
      background: #def3e6;

      color: #176338;
    }


    .rejected {
      background: #f9dddd;

      color: #962e2e;
    }


    .active-status {
      background: #def3e6;

      color: #176338;
    }


    .inactive-status {
      background: #e8ece9;

      color: #626c66;
    }


    .info-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          1fr
        );

      gap: 9px;

      margin-bottom: 14px;
    }


    .info {
      padding: 11px;

      background: white;

      border:
        1px solid #e5e9e6;

      border-radius: 9px;

      font-size: 14px;
    }


    .info strong {
      display: block;

      color: #1f7a4d;

      font-size: 12px;
    }


    .message {
      margin-bottom: 14px;

      padding: 11px;

      background: white;

      border:
        1px solid #e5e9e6;

      border-radius: 9px;

      white-space: pre-wrap;
    }


    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }


    .loading,
    .empty,
    .error {
      padding: 25px;

      border-radius: 10px;

      text-align: center;
    }


    .loading,
    .empty {
      background: #f0f3f1;

      color: #66716b;
    }


    .error {
      background: #fff0f0;

      color: #922;
    }


    /* MODAL */


    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 1000;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(
          10,
          18,
          13,
          0.76
        );
    }


    .modal.open {
      display: flex;
    }


    .modal-box {
      position: relative;

      width: 100%;

      max-width: 750px;

      max-height: 92vh;

      overflow-y: auto;

      padding: 25px;

      background: white;

      border-radius: 18px;
    }


    .modal-close {
      position: absolute;

      top: 13px;

      right: 13px;

      width: 37px;

      height: 37px;

      border: 0;

      border-radius: 50%;

      background: #1f2933;

      color: white;

      font-size: 20px;
    }


    .modal h2 {
      margin-bottom: 20px;
    }


    .form-grid {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 13px;
    }


    .form-group.full {
      grid-column:
        1 / -1;
    }


    label {
      display: block;

      margin-bottom: 5px;

      font-size: 13px;

      font-weight: bold;
    }


    input,
    textarea,
    select {
      width: 100%;

      min-height: 44px;

      padding: 10px;

      border:
        1px solid #dce3de;

      border-radius: 8px;
    }


    textarea {
      min-height: 100px;

      resize: vertical;
    }


    .checkbox {
      display: flex;

      align-items: center;

      gap: 8px;
    }


    .checkbox input {
      width: auto;

      min-height: auto;
    }


    .form-actions {
      display: flex;

      gap: 9px;

      margin-top: 18px;
    }


    @media (
      max-width: 650px
    ) {

      .header-inner {
        flex-direction: column;

        align-items: flex-start;

        gap: 5px;
      }


      .info-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }


      .form-group.full {
        grid-column: auto;
      }

    }

  </style>

</head>


<body>


<div
  id="loginView"
  class="login"
>

  <h2>
    Admin Girişi
  </h2>

  <p>
    Yönetim paneline giriş yap.
  </p>

  <input
    id="password"
    type="password"
    placeholder="Admin şifresi"
  >

  <button
    id="loginButton"
    type="button"
  >
    Giriş Yap
  </button>

  <div
    id="loginError"
    class="login-error"
  ></div>

</div>


<div
  id="adminView"
  style="display:none;"
>

<header>

  <div class="header-inner">

    <h2>
      Güzelim Kadirli Admin
    </h2>

    <a href="/">
      ← Siteye dön
    </a>

  </div>

</header>


<main>

  <div class="tabs">

    <button
      class="tab active"
      data-tab="requests"
    >
      Başvurular
    </button>

    <button
      class="tab"
      data-tab="restaurants"
    >
      Restoranlar
    </button>

    <button
      class="tab"
      data-tab="places"
    >
      Gezilecek Yerler
    </button>

  </div>


  <!-- REQUESTS -->

  <section
    id="requests"
    class="panel active"
  >

    <div class="box">

      <div class="box-head">

        <div>
          <h2>
            İşletme Başvuruları
          </h2>

          <p>
            Onaylanan restoran ve kafeler
            otomatik siteye eklenir.
          </p>
        </div>

        <button
          id="refreshRequests"
          class="secondary"
        >
          Yenile
        </button>

      </div>

      <div id="requestList"></div>

    </div>

  </section>


  <!-- RESTAURANTS -->

  <section
    id="restaurants"
    class="panel"
  >

    <div class="box">

      <div class="box-head">

        <div>
          <h2>
            Restoran Yönetimi
          </h2>

          <p>
            Restoranları yönet.
          </p>
        </div>


        <div class="actions">

          <button
            id="refreshRestaurants"
            class="secondary"
          >
            Yenile
          </button>

          <button
            id="newRestaurant"
            class="primary"
          >
            + Yeni Restoran
          </button>

        </div>

      </div>


      <div id="restaurantList"></div>

    </div>

  </section>


  <!-- PLACES -->

  <section
    id="places"
    class="panel"
  >

    <div class="box">

      <div class="box-head">

        <div>
          <h2>
            Gezilecek Yerler
          </h2>

          <p>
            Ala Camii, Karatepe-Aslantaş
            gibi yerleri buradan yönet.
          </p>
        </div>


        <div class="actions">

          <button
            id="refreshPlaces"
            class="secondary"
          >
            Yenile
          </button>

          <button
            id="newPlace"
            class="primary"
          >
            + Yeni Yer
          </button>

        </div>

      </div>


      <div id="placeList"></div>

    </div>

  </section>

</main>

</div>


<!-- GENERIC EDIT MODAL -->

<div
  id="editModal"
  class="modal"
>

  <div class="modal-box">

    <button
      id="modalClose"
      class="modal-close"
      type="button"
    >
      ×
    </button>

    <h2 id="modalTitle"></h2>

    <form id="editForm">

      <div
        id="formFields"
        class="form-grid"
      ></div>

      <div class="form-actions">

        <button
          class="primary"
          type="submit"
        >
          Kaydet
        </button>

        <button
          id="cancelEdit"
          class="secondary"
          type="button"
        >
          İptal
        </button>

      </div>

    </form>

  </div>

</div>


<script>

let password = "";

let restaurants = [];

let places = [];

let editType = "";

let editId = null;


const loginView =
  document.getElementById("loginView");

const adminView =
  document.getElementById("adminView");

const requestList =
  document.getElementById("requestList");

const restaurantList =
  document.getElementById("restaurantList");

const placeList =
  document.getElementById("placeList");

const modal =
  document.getElementById("editModal");

const formFields =
  document.getElementById("formFields");


function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


async function adminFetch(
  url,
  options = {}
) {

  return fetch(
    url,
    {
      ...options,

      headers: {
        ...(options.headers || {}),

        "X-Admin-Password":
          password
      }
    }
  );

}


/* LOGIN */


async function login() {

  password =
    document
      .getElementById("password")
      .value
      .trim();


  const response =
    await adminFetch(
      "/api/admin/requests"
    );


  if (!response.ok) {

    password = "";

    document
      .getElementById("loginError")
      .textContent =
        "Şifre yanlış.";

    return;

  }


  loginView.style.display =
    "none";

  adminView.style.display =
    "block";


  await Promise.all([
    loadRequests(),
    loadRestaurants(),
    loadPlaces()
  ]);

}


document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    login
  );


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {
        login();
      }

    }
  );


/* TABS */


document
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(item =>
            item.classList.remove(
              "active"
            )
          );


        document
          .querySelectorAll(".panel")
          .forEach(item =>
            item.classList.remove(
              "active"
            )
          );


        button.classList.add(
          "active"
        );


        document
          .getElementById(
            button.dataset.tab
          )
          .classList.add(
            "active"
          );

      }
    );

  });


/* REQUESTS */


async function loadRequests() {

  requestList.innerHTML =
    '<div class="loading">Yükleniyor...</div>';


  const response =
    await adminFetch(
      "/api/admin/requests"
    );


  const data =
    await response.json();


  if (!response.ok) {

    requestList.innerHTML =
      '<div class="error">Başvurular yüklenemedi.</div>';

    return;

  }


  const requests =
    data.requests || [];


  if (!requests.length) {

    requestList.innerHTML =
      '<div class="empty">Henüz başvuru yok.</div>';

    return;

  }


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "list";


  requests.forEach(item => {

    const card =
      document.createElement("article");


    card.className =
      "item";


    card.innerHTML = `

      <div class="item-top">

        <div>

          <div class="item-name">
            ${escapeHtml(item.business_name)}
          </div>

          ${escapeHtml(item.category)}

        </div>


        <span class="status ${escapeHtml(item.status)}">
          ${escapeHtml(item.status)}
        </span>

      </div>


      <div class="info-grid">

        <div class="info">
          <strong>Telefon</strong>
          ${escapeHtml(item.phone || "-")}
        </div>

        <div class="info">
          <strong>Adres</strong>
          ${escapeHtml(item.address || "-")}
        </div>

      </div>


      <div class="message">
        ${escapeHtml(item.message || "Mesaj yok")}
      </div>


      <div class="actions">

        ${
          item.status !== "approved"

          ? `
            <button
              class="primary"
              data-approve="${item.id}"
            >
              ✓ Onayla
            </button>
          `

          : ""
        }


        <button
          class="warning"
          data-reject="${item.id}"
        >
          ✕ Reddet
        </button>


        <button
          class="danger"
          data-request-delete="${item.id}"
        >
          Sil
        </button>

      </div>

    `;


    wrapper.appendChild(card);

  });


  requestList.innerHTML = "";

  requestList.appendChild(
    wrapper
  );


  requestList
    .querySelectorAll(
      "[data-approve]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          approveRequest(
            button.dataset.approve
          )
      );

    });


  requestList
    .querySelectorAll(
      "[data-reject]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          rejectRequest(
            button.dataset.reject
          )
      );

    });


  requestList
    .querySelectorAll(
      "[data-request-delete]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          deleteRequest(
            button.dataset.requestDelete
          )
      );

    });

}


async function approveRequest(id) {

  const response =
    await adminFetch(
      `/api/admin/requests/${id}/approve`,
      {
        method: "POST"
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    alert(
      data.error ||
      "Onaylama başarısız."
    );

    return;

  }


  if (
    data.restaurant_created
  ) {

    alert(
      "Başvuru onaylandı ve restoran siteye eklendi."
    );

  } else {

    alert(
      "Başvuru onaylandı."
    );

  }


  await Promise.all([
    loadRequests(),
    loadRestaurants()
  ]);

}


async function rejectRequest(id) {

  await adminFetch(
    `/api/admin/requests/${id}`,
    {
      method: "PATCH",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({
          status: "rejected"
        })
    }
  );


  loadRequests();

}


async function deleteRequest(id) {

  if (
    !confirm(
      "Başvuru silinsin mi?"
    )
  ) {
    return;
  }


  await adminFetch(
    `/api/admin/requests/${id}`,
    {
      method: "DELETE"
    }
  );


  loadRequests();

}


/* RESTAURANTS */


async function loadRestaurants() {

  restaurantList.innerHTML =
    '<div class="loading">Yükleniyor...</div>';


  const response =
    await adminFetch(
      "/api/admin/restaurants"
    );


  const data =
    await response.json();


  restaurants =
    data.restaurants || [];


  renderRestaurants();

}


function renderRestaurants() {

  if (!restaurants.length) {

    restaurantList.innerHTML =
      '<div class="empty">Restoran yok.</div>';

    return;

  }


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "list";


  restaurants.forEach(item => {

    const card =
      document.createElement("article");


    card.className =
      "item";


    card.innerHTML = `

      <div class="item-top">

        <div>

          <div class="item-name">
            ${escapeHtml(item.name)}
          </div>

          ${escapeHtml(item.category)}

        </div>


        <span
          class="status ${
            item.active
              ? "active-status"
              : "inactive-status"
          }"
        >
          ${
            item.active
              ? "active"
              : "inactive"
          }
        </span>

      </div>


      <div class="info-grid">

        <div class="info">
          <strong>Puan</strong>
          ${escapeHtml(item.rating)}
        </div>

        <div class="info">
          <strong>Telefon</strong>
          ${escapeHtml(item.phone || "-")}
        </div>

      </div>


      <div class="message">
        ${escapeHtml(item.address || "Adres yok")}
      </div>


      <div class="actions">

        <button
          class="edit"
          data-edit-restaurant="${item.id}"
        >
          Düzenle
        </button>


        <button
          class="danger"
          data-delete-restaurant="${item.id}"
        >
          Sil
        </button>

      </div>

    `;


    wrapper.appendChild(card);

  });


  restaurantList.innerHTML = "";

  restaurantList.appendChild(
    wrapper
  );


  restaurantList
    .querySelectorAll(
      "[data-edit-restaurant]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          openRestaurantForm(
            Number(
              button.dataset.editRestaurant
            )
          )
      );

    });


  restaurantList
    .querySelectorAll(
      "[data-delete-restaurant]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          deleteRestaurant(
            button.dataset.deleteRestaurant
          )
      );

    });

}


/* PLACES */


async function loadPlaces() {

  placeList.innerHTML =
    '<div class="loading">Yükleniyor...</div>';


  const response =
    await adminFetch(
      "/api/admin/places"
    );


  const data =
    await response.json();


  places =
    data.places || [];


  renderPlaces();

}


function renderPlaces() {

  if (!places.length) {

    placeList.innerHTML =
      '<div class="empty">Yer yok.</div>';

    return;

  }


  const wrapper =
    document.createElement("div");


  wrapper.className =
    "list";


  places.forEach(item => {

    const card =
      document.createElement("article");


    card.className =
      "item";


    card.innerHTML = `

      <div class="item-top">

        <div>

          <div class="item-name">
            ${escapeHtml(item.name)}
          </div>

          ${escapeHtml(item.category)}

        </div>


        <span
          class="status ${
            item.active
              ? "active-status"
              : "inactive-status"
          }"
        >
          ${
            item.active
              ? "active"
              : "inactive"
          }
        </span>

      </div>


      <div class="message">
        ${escapeHtml(item.address || "-")}
      </div>


      <div class="actions">

        <button
          class="edit"
          data-edit-place="${item.id}"
        >
          Düzenle
        </button>


        <button
          class="danger"
          data-delete-place="${item.id}"
        >
          Sil
        </button>

      </div>

    `;


    wrapper.appendChild(card);

  });


  placeList.innerHTML = "";

  placeList.appendChild(
    wrapper
  );


  placeList
    .querySelectorAll(
      "[data-edit-place]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          openPlaceForm(
            Number(
              button.dataset.editPlace
            )
          )
      );

    });


  placeList
    .querySelectorAll(
      "[data-delete-place]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          deletePlace(
            button.dataset.deletePlace
          )
      );

    });

}


/* GENERIC MODAL */


function openModal() {

  modal.classList.add(
    "open"
  );

}


function closeModal() {

  modal.classList.remove(
    "open"
  );

}


document
  .getElementById("modalClose")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("cancelEdit")
  .addEventListener(
    "click",
    closeModal
  );


/* RESTAURANT FORM */


function openRestaurantForm(id = null) {

  editType =
    "restaurant";

  editId =
    id;


  const item =
    restaurants.find(
      x =>
        Number(x.id) ===
        Number(id)
    ) || {};


  document
    .getElementById("modalTitle")
    .textContent =
      id
        ? "Restoran Düzenle"
        : "Yeni Restoran";


  formFields.innerHTML = `

    <div class="form-group">
      <label>Ad *</label>

      <input
        id="fName"
        value="${escapeHtml(item.name || "")}"
        required
      >
    </div>


    <div class="form-group">
      <label>Kategori *</label>

      <input
        id="fCategory"
        value="${escapeHtml(item.category || "")}"
        required
      >
    </div>


    <div class="form-group">
      <label>Filtre *</label>

      <select id="fFilter">

        <option value="kebap">
          Kebap
        </option>

        <option value="lokanta">
          Lokanta
        </option>

        <option value="lahmacun">
          Lahmacun
        </option>

        <option value="cafe">
          Cafe
        </option>

      </select>

    </div>


    <div class="form-group">
      <label>Puan</label>

      <input
        id="fRating"
        type="number"
        min="0"
        max="5"
        step="0.1"
        value="${escapeHtml(item.rating ?? 0)}"
      >
    </div>


    <div class="form-group full">
      <label>Açıklama</label>

      <textarea id="fDescription">${escapeHtml(item.description || "")}</textarea>
    </div>


    <div class="form-group full">
      <label>Adres</label>

      <input
        id="fAddress"
        value="${escapeHtml(item.address || "")}"
      >
    </div>


    <div class="form-group">
      <label>Telefon</label>

      <input
        id="fPhone"
        value="${escapeHtml(item.phone || "")}"
      >
    </div>


    <div class="form-group">
      <label>Çalışma Saatleri</label>

      <input
        id="fHours"
        value="${escapeHtml(item.hours || "")}"
      >
    </div>


    <div class="form-group">
      <label>Görsel</label>

      <input
        id="fImage"
        value="${escapeHtml(item.image || "")}"
      >
    </div>


    <div class="form-group">
      <label>Emoji</label>

      <input
        id="fEmoji"
        value="${escapeHtml(item.emoji || "🍽️")}"
      >
    </div>


    <div class="form-group full">

      <label class="checkbox">
        <input
          id="fFeatured"
          type="checkbox"
          ${item.featured ? "checked" : ""}
        >

        Öne çıkar
      </label>

      <br>

      <label class="checkbox">
        <input
          id="fActive"
          type="checkbox"
          ${item.active === 0 ? "" : "checked"}
        >

        Aktif
      </label>

    </div>

  `;


  document
    .getElementById("fFilter")
    .value =
      item.filter || "kebap";


  openModal();

}

/* SAVE */


document
  .getElementById("editForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if (
        editType ===
        "restaurant"
      ) {

        const payload = {

          name:
            document.getElementById("fName").value,

          category:
            document.getElementById("fCategory").value,

          filter:
            document.getElementById("fFilter").value,

          rating:
            Number(
              document.getElementById("fRating").value
            ),

          description:
            document.getElementById("fDescription").value,

          address:
            document.getElementById("fAddress").value,

          phone:
            document.getElementById("fPhone").value,

          hours:
            document.getElementById("fHours").value,

          image:
            document.getElementById("fImage").value,

          emoji:
            document.getElementById("fEmoji").value,

          featured:
            document.getElementById("fFeatured").checked,

          active:
            document.getElementById("fActive").checked

        };


        await adminFetch(

          editId

            ? `/api/admin/restaurants/${editId}`

            : "/api/admin/restaurants",

          {
            method:
              editId
                ? "PATCH"
                : "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }

        );


        await loadRestaurants();

      }


      if (
        editType ===
        "place"
      ) {

        const payload = {

          name:
            document.getElementById("fName").value,

          category:
            document.getElementById("fCategory").value,

          description:
            document.getElementById("fDescription").value,

          address:
            document.getElementById("fAddress").value,

          image:
            document.getElementById("fImage").value,

          emoji:
            document.getElementById("fEmoji").value,

          active:
            document.getElementById("fActive").checked

        };


        await adminFetch(

          editId

            ? `/api/admin/places/${editId}`

            : "/api/admin/places",

          {
            method:
              editId
                ? "PATCH"
                : "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              )
          }

        );


        await loadPlaces();

      }


      closeModal();

    }
  );


/* DELETE RESTAURANT */


async function deleteRestaurant(id) {

  if (
    !confirm(
      "Restoran silinsin mi?"
    )
  ) {
    return;
  }


  await adminFetch(
    `/api/admin/restaurants/${id}`,
    {
      method: "DELETE"
    }
  );


  loadRestaurants();

}


/* DELETE PLACE */


async function deletePlace(id) {

  if (
    !confirm(
      "Yer silinsin mi?"
    )
  ) {
    return;
  }


  await adminFetch(
    `/api/admin/places/${id}`,
    {
      method: "DELETE"
    }
  );


  loadPlaces();

}


/* BUTTONS */


document
  .getElementById("newRestaurant")
  .addEventListener(
    "click",
    () =>
      openRestaurantForm()
  );


document
  .getElementById("newPlace")
  .addEventListener(
    "click",
    () =>
      openPlaceForm()
  );


document
  .getElementById("refreshRequests")
  .addEventListener(
    "click",
    loadRequests
  );


document
  .getElementById("refreshRestaurants")
  .addEventListener(
    "click",
    loadRestaurants
  );


document
  .getElementById("refreshPlaces")
  .addEventListener(
    "click",
    loadPlaces
  );


</script>


</body>

</html>
