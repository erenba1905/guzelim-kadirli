<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Güzelim Kadirli Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f5;
      color: #1f2933;
      line-height: 1.5;
    }

    .topbar {
      background: #173122;
      color: white;
      padding: 18px 24px;
    }

    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .topbar h1 {
      font-size: 22px;
    }

    .topbar a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 60px;
    }

    .panel {
      background: white;
      border: 1px solid #e2e7e3;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel-head h2 {
      font-size: 24px;
    }

    .refresh-btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 16px;
      background: #1f7a4d;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat {
      background: white;
      border: 1px solid #e2e7e3;
      border-radius: 14px;
      padding: 20px;
    }

    .stat strong {
      display: block;
      font-size: 30px;
      color: #1f7a4d;
    }

    .requests {
      display: grid;
      gap: 16px;
    }

    .request-card {
      border: 1px solid #e2e7e3;
      border-radius: 14px;
      padding: 20px;
      background: #fbfcfb;
    }

    .request-card.approved {
      border-color: #b6dec5;
      background: #f4fbf6;
    }

    .request-card.rejected {
      border-color: #e4b7b7;
      background: #fff7f7;
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .request-name {
      font-size: 20px;
      font-weight: 800;
    }

    .status {
      padding: 6px 10px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status.pending {
      background: #fff1c9;
      color: #7b5a00;
    }

    .status.approved {
      background: #dff3e6;
      color: #176338;
    }

    .status.rejected {
      background: #f8dede;
      color: #922b2b;
    }

    .request-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .info-box {
      background: white;
      border: 1px solid #e5e9e6;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
    }

    .info-box strong {
      display: block;
      margin-bottom: 3px;
      color: #1f7a4d;
      font-size: 12px;
    }

    .message-box {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 10px;
      background: white;
      border: 1px solid #e5e9e6;
      white-space: pre-wrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .action-btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .approve-btn {
      background: #1f7a4d;
      color: white;
    }

    .reject-btn {
      background: #d49a31;
      color: white;
    }

    .delete-btn {
      background: #b84444;
      color: white;
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .loading,
    .empty,
    .error {
      padding: 30px;
      text-align: center;
      border-radius: 12px;
    }

    .loading,
    .empty {
      background: #f1f4f2;
      color: #66716b;
    }

    .error {
      background: #fff0f0;
      color: #8b2d2d;
      border: 1px solid #e8bcbc;
    }

    .login-box {
      max-width: 460px;
      margin: 80px auto;
      background: white;
      border: 1px solid #e2e7e3;
      border-radius: 18px;
      padding: 28px;
    }

    .login-box h2 {
      margin-bottom: 8px;
    }

    .login-box p {
      color: #66716b;
      margin-bottom: 20px;
    }

    .login-box label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    .login-box input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #dfe5e0;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 9px;
      background: #1f7a4d;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .login-error {
      margin-top: 12px;
      color: #a22;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .request-grid {
        grid-template-columns: 1fr;
      }

      .request-top {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div id="loginView" class="login-box">
    <h2>Admin Girişi</h2>
    <p>Yönetim paneline erişmek için admin şifresini gir.</p>

    <label for="adminPassword">Şifre</label>

    <input
      id="adminPassword"
      type="password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      Giriş Yap
    </button>

    <div id="loginError" class="login-error"></div>
  </div>


  <div id="adminView" style="display:none;">

    <header class="topbar">
      <div class="topbar-inner">
        <h1>Güzelim Kadirli Admin</h1>

        <a href="/">
          ← Siteye dön
        </a>
      </div>
    </header>

    <main>

      <div class="stats">

        <div class="stat">
          <strong id="pendingCount">0</strong>
          Bekleyen
        </div>

        <div class="stat">
          <strong id="approvedCount">0</strong>
          Onaylanan
        </div>

        <div class="stat">
          <strong id="rejectedCount">0</strong>
          Reddedilen
        </div>

      </div>


      <section class="panel">

        <div class="panel-head">

          <div>
            <h2>İşletme Başvuruları</h2>
            <p>Başvuruları incele, onayla veya reddet.</p>
          </div>

          <button
            id="refreshButton"
            class="refresh-btn"
            type="button"
          >
            Yenile
          </button>

        </div>


        <div id="requestList">
          <div class="loading">
            Başvurular yükleniyor...
          </div>
        </div>

      </section>

    </main>

  </div>


  <script>

    const loginView =
      document.getElementById("loginView");

    const adminView =
      document.getElementById("adminView");

    const passwordInput =
      document.getElementById("adminPassword");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const requestList =
      document.getElementById("requestList");

    const refreshButton =
      document.getElementById("refreshButton");


    let adminPassword = "";


    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    async function adminFetch(url, options = {}) {

      const headers = {
        ...(options.headers || {}),
        "X-Admin-Password": adminPassword
      };

      const response =
        await fetch(url, {
          ...options,
          headers
        });

      return response;
    }


    async function login() {

      loginError.textContent = "";

      const value =
        passwordInput.value.trim();

      if (!value) {
        loginError.textContent =
          "Şifre girmen gerekiyor.";
        return;
      }

      adminPassword = value;

      try {

        const response =
          await adminFetch(
            "/api/admin/requests"
          );

        if (!response.ok) {
          throw new Error();
        }

        loginView.style.display =
          "none";

        adminView.style.display =
          "block";

        await loadRequests();

      } catch {

        adminPassword = "";

        loginError.textContent =
          "Şifre yanlış veya admin API erişilemiyor.";

      }

    }


    async function loadRequests() {

      requestList.innerHTML = `
        <div class="loading">
          Başvurular yükleniyor...
        </div>
      `;

      try {

        const response =
          await adminFetch(
            "/api/admin/requests"
          );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Başvurular alınamadı."
          );
        }

        renderRequests(
          data.requests || []
        );

      } catch (error) {

        requestList.innerHTML = `
          <div class="error">
            ${escapeHtml(error.message)}
          </div>
        `;

      }

    }


    function renderRequests(requests) {

      const pending =
        requests.filter(
          item => item.status === "pending"
        ).length;

      const approved =
        requests.filter(
          item => item.status === "approved"
        ).length;

      const rejected =
        requests.filter(
          item => item.status === "rejected"
        ).length;


      document.getElementById(
        "pendingCount"
      ).textContent = pending;

      document.getElementById(
        "approvedCount"
      ).textContent = approved;

      document.getElementById(
        "rejectedCount"
      ).textContent = rejected;


      if (!requests.length) {

        requestList.innerHTML = `
          <div class="empty">
            Henüz başvuru yok.
          </div>
        `;

        return;

      }


      const wrapper =
        document.createElement("div");

      wrapper.className =
        "requests";


      requests.forEach(item => {

        const card =
          document.createElement("article");

        card.className =
          "request-card " +
          escapeHtml(item.status);


        card.innerHTML = `

          <div class="request-top">

            <div>
              <div class="request-name">
                ${escapeHtml(item.business_name)}
              </div>

              <div>
                ${escapeHtml(item.category)}
              </div>
            </div>

            <span class="status ${escapeHtml(item.status)}">
              ${escapeHtml(item.status)}
            </span>

          </div>


          <div class="request-grid">

            <div class="info-box">
              <strong>Telefon</strong>
              ${escapeHtml(item.phone || "-")}
            </div>

            <div class="info-box">
              <strong>Adres</strong>
              ${escapeHtml(item.address || "-")}
            </div>

            <div class="info-box">
              <strong>Tarih</strong>
              ${escapeHtml(item.created_at || "-")}
            </div>

            <div class="info-box">
              <strong>ID</strong>
              ${escapeHtml(item.id)}
            </div>

          </div>


          <div class="message-box">
            ${escapeHtml(item.message || "Mesaj yok.")}
          </div>


          <div class="actions">

            <button
              class="action-btn approve-btn"
              data-action="approved"
              data-id="${item.id}"
              type="button"
            >
              ✓ Onayla
            </button>

            <button
              class="action-btn reject-btn"
              data-action="rejected"
              data-id="${item.id}"
              type="button"
            >
              ✕ Reddet
            </button>

            <button
              class="action-btn delete-btn"
              data-action="delete"
              data-id="${item.id}"
              type="button"
            >
              Sil
            </button>

          </div>

        `;


        wrapper.appendChild(card);

      });


      requestList.innerHTML = "";

      requestList.appendChild(
        wrapper
      );


      requestList
        .querySelectorAll(
          "[data-action]"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const id =
                button.dataset.id;

              const action =
                button.dataset.action;


              if (action === "delete") {
                deleteRequest(id);
              } else {
                updateStatus(
                  id,
                  action
                );
              }

            }
          );

        });

    }


    async function updateStatus(
      id,
      status
    ) {

      try {

        const response =
          await adminFetch(
            `/api/admin/requests/${id}`,
            {
              method: "PATCH",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  status
                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {
          throw new Error(
            data.error ||
            "Güncelleme başarısız."
          );
        }


        await loadRequests();


      } catch (error) {

        alert(error.message);

      }

    }


    async function deleteRequest(id) {

      const confirmed =
        confirm(
          "Bu başvuruyu gerçekten silmek istiyor musun?"
        );


      if (!confirmed) {
        return;
      }


      try {

        const response =
          await adminFetch(
            `/api/admin/requests/${id}`,
            {
              method: "DELETE"
            }
          );


        const data =
          await response.json();


        if (!response.ok) {
          throw new Error(
            data.error ||
            "Silme başarısız."
          );
        }


        await loadRequests();


      } catch (error) {

        alert(error.message);

      }

    }


    loginButton.addEventListener(
      "click",
      login
    );


    passwordInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {
          login();
        }

      }
    );


    refreshButton.addEventListener(
      "click",
      loadRequests
    );

  </script>

</body>
</html>
